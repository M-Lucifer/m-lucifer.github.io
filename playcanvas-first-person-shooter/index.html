<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>First Person Shooter | PlayCanvas Demo</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.72);
            --panel-border: rgba(148, 163, 184, 0.25);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #f97316;
            --accent-strong: #fb923c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(249, 115, 22, 0.22), transparent 28%),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
        }

        main {
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 40px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
        }

        .hero {
            padding: 28px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(32px, 4vw, 48px);
            line-height: 1.05;
        }

        p {
            margin: 0;
            max-width: 760px;
            color: var(--muted);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.18s ease, background-color 0.18s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button-primary {
            color: #fff7ed;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
        }

        .button-secondary {
            color: var(--text);
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .viewer {
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        .tips {
            margin-top: 16px;
            padding: 16px 18px;
            font-size: 14px;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            main {
                width: min(100% - 20px, 1200px);
                padding-top: 20px;
            }

            .hero {
                padding: 22px 18px;
            }

            .viewer {
                aspect-ratio: 10 / 16;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="panel hero">
            <h1>First Person Shooter</h1>
            <p>这个页面把 PlayCanvas 导出项目作为站内互动内容嵌入进来。默认直接在页面里预览；如果你要全屏体验，或者后续要单独分享模型页面，可以打开独立版本。</p>
            <div class="actions">
                <a class="button button-primary" href="../playcanvas-builds/first-person-shooter/" target="_blank" rel="noreferrer">打开独立页面</a>
                <a class="button button-secondary" href="/">返回首页</a>
            </div>
        </section>

        <section class="panel viewer">
            <iframe
                src="../playcanvas-builds/first-person-shooter/"
                title="PlayCanvas First Person Shooter Demo"
                allow="fullscreen; accelerometer; gyroscope; xr-spatial-tracking"
                allowfullscreen
                loading="eager"></iframe>
        </section>

        <section class="panel tips">
            鼠标和键盘事件会优先落在嵌入的应用里。如果某些浏览器里锁定鼠标或全屏不稳定，直接点上面的“打开独立页面”会更稳。
        </section>
    </main>
</body>
</html>
